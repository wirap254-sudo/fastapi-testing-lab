name: API Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run unit + integration tests (pytest)
        run: pytest --cov=app

      - name: Setup Node.js (for Newman)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman tests (Newman)
        run: python scripts/run_postman.py

      - name: Upload Postman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: reports/
